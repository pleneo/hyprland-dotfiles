# ~/.config/starship.toml
# Tema Moderno Minimalista (Diretório + Ícones Nerd Font + Git Branch)

format = """
$directory\
$git_branch\
$git_status\
$package\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# Linha de continuação
continuation_prompt = "▶▶ "

# Adicionar espaço antes do prompt
add_newline = true

[character]
success_symbol = "[❯](bold #1db954) "
error_symbol = "[❯](bold #f38ba8) "
vimcmd_symbol = "[❮](bold #b4befe) "

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold #89b4fa"
read_only = " 󰌾"
read_only_style = "bold #f38ba8"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰉍 Downloads"
"Music" = "󰎄 Music"
"Pictures" = "󰋩 Pictures"
"Videos" = "󰕧 Videos"
"Projects" = "󰲋 Projects"
".config" = "󱁤 .config"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = "󰊢 "
style = "bold #cba6f7"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold #f9e2af"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰘓 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold #fab387) "

[nodejs]
format = "via [$symbol($version )]($style)"
symbol = "󰎙 "
style = "bold #a6e3a1"

[python]
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
symbol = "󰌠 "
style = "bold #f9e2af"

[rust]
format = "via [$symbol($version )]($style)"
symbol = "󱘗 "
style = "bold #eba0ac"

[golang]
format = "via [$symbol($version )]($style)"
symbol = "󰟓 "
style = "bold #89dceb"

[package]
disabled = true
